<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>General English Placement Test</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1f2933;--muted:#697586;--accent:#2f6fed;--accent-dark:#1e4fb8;--good:#1f9d55;--bad:#d64545;--border:#e3e8ef;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;}
  .topbar-left{display:flex;align-items:center;gap:10px;}
  .topbar h1{font-size:15px;margin:0;font-weight:600;}
  #timer{font-size:20px;font-weight:700;padding:6px 14px;border-radius:8px;background:#eef3ff;color:var(--accent-dark);min-width:90px;text-align:center;}
  #timer.warn{background:#fff0e0;color:#b8590e;}
  #timer.danger{background:#ffe0e0;color:var(--bad);}
  .wrap{max-width:700px;margin:0 auto;padding:24px 16px 80px;}
  .start-card{background:#fff;border-radius:14px;padding:32px;margin-top:40px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center;}
  .start-card h2{margin:12px 0 6px;}
  .instruction-box{background:#eef3ff;border-radius:8px;padding:12px 16px;font-weight:600;color:#1e4fb8;font-size:14px;margin:14px 0;line-height:1.7;}
  input#studentName{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--border);border-radius:8px;margin:12px 0;}
  .progress-bar-wrap{background:#e3e8ef;border-radius:99px;height:6px;margin-bottom:20px;}
  .progress-bar{background:var(--accent);height:6px;border-radius:99px;transition:width .3s;}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .qmeta{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
  .qtext{font-size:16px;line-height:1.55;margin-bottom:16px;font-weight:500;}
  .options{display:flex;flex-direction:column;gap:9px;}
  .option{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;font-size:14.5px;transition:all .15s;}
  .option:hover{background:#f7f9fc;border-color:#c4cdd9;}
  .option.selected{border-color:var(--accent);background:#eef3ff;font-weight:500;}
  .option-letter{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:var(--muted);}
  .option.selected .option-letter{border-color:var(--accent);color:var(--accent);background:#fff;}
  .reading-box{background:#fbfbfc;border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;font-size:14.5px;line-height:1.65;color:#3a4452;max-height:230px;overflow-y:auto;}
  .nav-row{display:flex;justify-content:flex-end;margin-top:22px;gap:10px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;background:var(--accent);color:#fff;padding:12px 24px;font-size:15px;font-weight:600;transition:background .15s;}
  button:hover{background:var(--accent-dark);}
  button:disabled{background:#c4cdd9;cursor:not-allowed;}
  /* Listening */
  .listening-card{background:#fff;border-radius:14px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .listen-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border);}
  .listen-header h2{margin:0;color:var(--accent-dark);font-size:18px;}
  .audio-box{display:flex;align-items:center;gap:14px;background:#f0f7ff;border:1px solid var(--border);border-radius:10px;padding:12px 18px;margin:16px 0;}
  .playbtn{background:var(--good);font-family:inherit;cursor:pointer;border:none;border-radius:8px;color:#fff;padding:10px 18px;font-size:14px;font-weight:600;}
  .playbtn:hover{background:#177a41;}
  .warn-box{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;font-size:13px;color:#7a5800;margin-bottom:14px;}
  .no-back-box{background:#fff0f0;border:2px solid #ffbaba;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;color:#c0392b;margin-top:20px;text-align:center;}
  .qblock{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .qblock:last-of-type{border-bottom:none;}
  .qnum{color:var(--accent-dark);font-weight:700;margin-right:4px;}
  /* Intro */
  .intro-card{background:#fff;border-radius:14px;padding:32px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  /* Result */
  #resultScreen{display:none;}
  .score-hero{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-radius:16px;padding:30px;text-align:center;margin-top:30px;}
  .score-hero .big{font-size:40px;font-weight:800;}
  .score-hero .net{font-size:18px;opacity:.9;margin-top:6px;}
  .score-hero .level{font-size:22px;margin-top:8px;font-weight:600;}
  .breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  .bcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .bcard h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;}
  .bcard .val{font-size:18px;font-weight:700;}
  .qlist{margin-top:24px;}
  .qrow{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;}
  .qrow.correct{color:var(--good);}
  .qrow.wrong{color:var(--bad);}
  .qrow.blank{color:var(--muted);}
  audio{display:none;}
  .hidden{display:none !important;}
</style>
</head>

// Build steps
// Grammar/Vocab/Reading: one question at a time
// Listening 1: all 3 on one page, Listening 2: all 3 on one page
const LISTENING_SECTIONS = ["Listening 1","Listening 2"];
const AUDIO_MAP = {"Listening 1":1,"Listening 2":2};
const SECTION_INTROS = {
  "Listening 1":{icon:"🎧", title:"Listening 1",       sub:"Önce soruları oku, sonra sesi dinle."},
  "Listening 2":{icon:"🎧", title:"Listening 2",       sub:"Önce soruları oku, sonra sesi dinle."},
  "Grammar":    {icon:"📝", title:"Grammar Bölümü",    sub:"Sorular tek tek çıkar — geri dönüş yoktur."},
  "Vocabulary": {icon:"📚", title:"Vocabulary Bölümü", sub:"Sorular tek tek çıkar — geri dönüş yoktur."},
  "Reading 1":  {icon:"📖", title:"Reading Bölümü",    sub:"Metni okuyup soruları cevaplayabilirsin — geri dönüş yoktur."},
};

let steps = [];
let seenSections = new Set();

EXAM.questions.forEach(q => {
  const sec = q.section;
  // Add intro once per section group
  if(!seenSections.has(sec)){
    seenSections.add(sec);
    if(SECTION_INTROS[sec]) steps.push({type:'intro', sec});
  }
  // Listening: group all qs in one step
  if(LISTENING_SECTIONS.includes(sec)){
    // Find or create group step
    const existing = steps.find(s=>s.type==='listening' && s.sec===sec);
    if(existing){ existing.qs.push(q); }
    else { steps.push({type:'listening', sec, qs:[q], audioId:AUDIO_MAP[sec]}); }
  } else if(sec==="Reading 1"||sec==="Reading 2"){
    steps.push({type:'reading', sec, q});
  } else {
    steps.push({type:'question', sec, q});
  }
});

let currentStep=0, studentName="", answers={}, timeLeft=35*60, timerInterval=null, submitted=false;

function startExam(){
  const name=document.getElementById('studentName').value.trim();
  if(!name){alert('Lütfen adın ve soyadını yaz.');return;}
  studentName=name;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('examScreen').classList.remove('hidden');
  document.getElementById('timer').classList.remove('hidden');
  startTimer(); renderStep();
}

function startTimer(){
  updateTimerDisplay();
  timerInterval=setInterval(()=>{timeLeft--;updateTimerDisplay();if(timeLeft<=0){clearInterval(timerInterval);submitExam(true);}},1000);
}

function updateTimerDisplay(){
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  const el=document.getElementById('timer');
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.classList.remove('warn','danger');
  if(timeLeft<=300)el.classList.add('danger');
  else if(timeLeft<=600)el.classList.add('warn');
}

function updateProgress(){
  const total=EXAM.questions.length, answered=Object.keys(answers).length;
  document.getElementById('progressLabel').textContent=`${answered} / ${total} soru cevaplandı`;
  document.getElementById('progressBar').style.width=Math.round(answered/total*100)+'%';
}

function renderStep(){
  updateProgress();
  stopAllAudio();
  const step=steps[currentStep];
  if(!step){submitExam(false);return;}
  if(step.type==='intro') renderIntro(step);
  else if(step.type==='question') renderQuestion(step);
  else if(step.type==='reading') renderReading(step);
  else if(step.type==='listening') renderListening(step);
  window.scrollTo({top:0,behavior:'smooth'});
}

function stopAllAudio(){}

function renderIntro(step){
  const {icon,title,sub}=SECTION_INTROS[step.sec];
  document.getElementById('examBody').innerHTML=`
  <div class="intro-card">
    <div style="font-size:52px;">${icon}</div>
    <h2 style="color:var(--accent-dark);margin:10px 0 6px;">${title}</h2>
    <p style="color:var(--muted);font-size:14px;">${sub}</p>
    <button onclick="nextStep()">Başla →</button>
  </div>`;
}

function optionsHtml(q){
  return q.options.map((opt,idx)=>{
    const letter=String.fromCharCode(65+idx);
    const sel=answers[q.num]===idx?'selected':'';
    return `<div class="option ${sel}" id="opt-${q.num}-${idx}" onclick="selectOption(${q.num},${idx},${!!document.getElementById('nextBtn')})">
      <div class="option-letter">${letter}</div><span>${opt}</span></div>`;
  }).join('');
}

function renderQuestion(step){
  const q=step.q;
  document.getElementById('examBody').innerHTML=`
  <div class="card">
    <div class="qmeta">${q.section} — Soru ${q.num}</div>
    <div class="qtext">${q.num}. ${q.text}</div>
    <div class="options">${optionsHtml(q)}</div>
    <div class="no-back-box">⚠️ Bir sonraki soruya geçtikten sonra bu soruya geri dönemezsiniz.</div>
    <div class="nav-row">
      <button id="nextBtn" onclick="nextStep()" ${answers[q.num]===undefined?'disabled':''}>İleri →</button>
    </div>
  </div>`;
}

function renderReading(step){
  const q=step.q;
  const text=EXAM.readings[step.sec]||'';
  document.getElementById('examBody').innerHTML=`
  <div class="card">
    <div class="qmeta">${q.section} — Soru ${q.num}</div>
    <div class="reading-box">${text}</div>
    <div class="qtext">${q.num}. ${q.text}</div>
    <div class="options">${optionsHtml(q)}</div>
    <div class="no-back-box">⚠️ Bir sonraki soruya geçtikten sonra bu soruya geri dönemezsiniz.</div>
    <div class="nav-row">
      <button id="nextBtn" onclick="nextStep()" ${answers[q.num]===undefined?'disabled':''}>İleri →</button>
    </div>
  </div>`;
}

function renderListening(step){
  let qblocksHtml = step.qs.map(q=>`
    <div class="qblock">
      <div class="qtext"><span class="qnum">${q.num}.</span>${q.text}</div>
      <div class="options">${optionsHtml(q)}</div>
    </div>`).join('');

  const isLast = currentStep===steps.length-1;
  const nextLabel = isLast ? 'Sınavı Bitir ✓' : 'İleri →';

  document.getElementById('examBody').innerHTML=`
  <div class="listening-card">
    <div class="listen-header">
      <span style="font-size:28px;">🎧</span>
      <h2>${step.sec}</h2>
    </div>
    <div class="warn-box">📌 Öğretmeniniz sesi çalarken aşağıdaki soruları cevaplayın.</div>
    ${qblocksHtml}
    <div class="nav-row">
      <button onclick="nextStep()">${nextLabel}</button>
    </div>
  </div>`;
}


function selectOption(qnum,idx){
  answers[qnum]=idx;
  document.querySelectorAll(`[id^="opt-${qnum}-"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt-${qnum}-${idx}`).classList.add('selected');
  const nb=document.getElementById('nextBtn');
  if(nb) nb.disabled=false;
  updateProgress();
}

function nextStep(){
  currentStep++;
  if(currentStep>=steps.length){submitExam(false);return;}
  renderStep();
}

function submitExam(auto){
  if(submitted)return;
  submitted=true;
  clearInterval(timerInterval);
  stopAllAudio();
  showResults();
}

function showResults(){
  document.getElementById('examScreen').classList.add('hidden');
  document.getElementById('resultScreen').style.display='block';
  let c=0,w=0,b=0;
  const macro={Grammar:[0,0],Vocabulary:[0,0],Reading:[0,0],Listening:[0,0]};
  const lvlStats={};
  let qlistHtml='';

  EXAM.questions.forEach(q=>{
    const ua=answers[q.num];
    const blank=ua===undefined, correct=!blank&&ua===q.correct, wrong=!blank&&!correct;
    if(correct)c++; else if(wrong)w++; else b++;
    const mk=q.section.startsWith('Listening')?'Listening':q.section.startsWith('Reading')?'Reading':q.section;
    if(macro[mk]){if(correct)macro[mk][0]++;else if(wrong)macro[mk][1]++;}
    const lv=q.level;
    if(lv){if(!lvlStats[lv])lvlStats[lv]={c:0,t:0};lvlStats[lv].t++;if(correct)lvlStats[lv].c++;}
    const uL=!blank?String.fromCharCode(65+ua):'—', cL=String.fromCharCode(65+q.correct);
    const rc=blank?'blank':(correct?'correct':'wrong'), ic=blank?'○':(correct?'✓':'✗');
    qlistHtml+=`<div class="qrow ${rc}"><span>${ic} S${q.num} — ${q.section}</span>
      <span>${blank?'Boş':('Senin: '+uL+(correct?'':' | Doğru: '+cL))}</span></div>`;
  });

  const net=Math.round((c-w/4)*100)/100;
  document.getElementById('studentNameResult').textContent=studentName;
  document.getElementById('scoreBig').textContent=`${c} D  /  ${w} Y  /  ${b} B`;
  document.getElementById('scoreNet').textContent=`Net: ${net} / ${EXAM.questions.length}`;

  // Seviye hesabı: net puan eşiğine göre
  const net40 = Math.round((c - w/4) * 100) / 100;
  let estLvl = 'A1';
  if(net40 >= 33) estLvl = 'B2';
  else if(net40 >= 23) estLvl = 'B1';
  else if(net40 >= 11) estLvl = 'A2';
  else estLvl = 'A1';
  document.getElementById('levelResult').textContent='Tahmini Seviye: '+estLvl;

  let bHtml='';
  Object.entries(macro).forEach(([k,v])=>{
    const n=Math.round((v[0]-v[1]/4)*100)/100;
    bHtml+=`<div class="bcard"><h4>${k}</h4><div class="val">${v[0]}D ${v[1]}Y → Net: ${n}</div></div>`;
  });
  document.getElementById('breakdownGrid').innerHTML=bHtml;
  document.getElementById('qlist').innerHTML='<h3 style="margin:20px 0 10px">Soru Detayları</h3>'+qlistHtml;

  sendToGoogleForm(macro,c,w,net,estLvl);
  downloadCSV(macro,c,w,net,estLvl);
}

function sendToGoogleForm(m,c,w,net,lvl){
  const fd=new FormData();
  fd.append('entry.1704509545',studentName);
  fd.append('entry.55992721',c+'D / '+w+'Y → Net: '+net);
  fd.append('entry.62054113',m.Listening?m.Listening[0]+'D '+m.Listening[1]+'Y':'—');
  fd.append('entry.551404973',m.Grammar?m.Grammar[0]+'D '+m.Grammar[1]+'Y':'—');
  fd.append('entry.1793838962',m.Vocabulary?m.Vocabulary[0]+'D '+m.Vocabulary[1]+'Y':'—');
  fd.append('entry.2128205401',m.Reading?m.Reading[0]+'D '+m.Reading[1]+'Y':'—');
  fd.append('entry.1812550524',lvl);
  fetch('https://docs.google.com/forms/u/0/d/e/1FAIpQLSe-8q1szhfktorpFxMNPcEQn3r5lh2mr_jHlCe8cnfKulf7IA/formResponse',
    {method:'POST',mode:'no-cors',body:fd})
    .then(()=>{document.getElementById('sendStatus').textContent='✓ Sonuç öğretmene gönderildi.';})
    .catch(()=>{document.getElementById('sendStatus').textContent='⚠ Gönderilemedi — CSV indirildi.';});
}

function downloadCSV(m,c,w,net,lvl){
  const rows=[
    ['Ogrenci','Dogru','Yanlis','Net','Grammar','Vocabulary','Reading','Listening','Seviye'],
    [studentName,c,w,net,
     m.Grammar?m.Grammar[0]+'D '+m.Grammar[1]+'Y':'—',
     m.Vocabulary?m.Vocabulary[0]+'D '+m.Vocabulary[1]+'Y':'—',
     m.Reading?m.Reading[0]+'D '+m.Reading[1]+'Y':'—',
     m.Listening?m.Listening[0]+'D '+m.Listening[1]+'Y':'—',lvl]
  ];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=studentName.replace(/\s+/g,'_')+'_sonuc.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

window.addEventListener('beforeunload',e=>{
  if(!submitted&&Object.keys(answers).length>0){e.preventDefault();e.returnValue='';}
});
</script>
