let Q=Q1;
const $=s=>document.querySelector(s),L="ABCD",fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let S,T;
function home(){$("#app").innerHTML=`<h1>Elveda Gülsarı</h1><p class="m">Cengiz Aytmatov · oturum 1: ${Q1.length}, oturum 2: ${Q2.length}, oturum 3: ${Q3.length} soru · süre soru sayısı kadar dk · 4 yanlış 1 doğruyu götürür</p><button class="p" onclick="go('exam',1)">1. Oturum · Sınav</button><button onclick="go('study',1)">1. Oturum · Çalışma</button><br><button class="p" onclick="go('exam',2)">2. Oturum · Sınav</button><button onclick="go('study',2)">2. Oturum · Çalışma</button><br><button class="p" onclick="go('exam',3)">3. Oturum · Sınav</button><button onclick="go('study',3)">3. Oturum · Çalışma</button>`}
function go(m,n){Q=n==3?Q3:n==2?Q2:Q1;S={i:0,a:Q.map(_=>-1),m,t:Q.length*60,d:0,c:0};clearInterval(T);if(m=="exam")T=setInterval(()=>{if(--S.t<=0)fin();else{const e=$("#tm");if(e)e.textContent=fmt(S.t)}},1e3);draw()}
function draw(){!S?home():S.d?res():ask()}
function ask(){const q=Q[S.i],a=S.a[S.i],st=S.m=="study"&&a>=0;
$("#app").innerHTML=`<div class="top"><b>${S.i+1} / ${Q.length}</b><span id="tm">${S.m=="exam"?fmt(S.t):"Çalışma"}</span></div>
<div class="card"><p class="q">${q[0]}</p>${[0,1,2,3].map(j=>{let c=a==j?"sel":"";if(st)c=j==q[5]?"ok":a==j?"no":"";return`<button class="o ${c}" onclick="pick(${j})"><i>${L[j]}</i><span>${q[j+1]}</span></button>`}).join("")}</div>
<div><button ${S.i?"":"disabled"} onclick="mv(-1)">Önceki</button><button ${S.i<Q.length-1?"":"disabled"} onclick="mv(1)">Sonraki</button><button class="p" onclick="end()">${S.c?"Emin misin? Bitir":"Bitir"}</button></div>
<div class="pal">${Q.map((_,i)=>`<b class="${i==S.i?"cur":""} ${S.a[i]>=0?"dn":""}" onclick="S.i=${i};S.c=0;draw()">${i+1}</b>`).join("")}</div>`}
function pick(j){if(S.m=="study"&&S.a[S.i]>=0)return;S.a[S.i]=S.a[S.i]==j&&S.m=="exam"?-1:j;S.c=0;draw()}
function mv(d){S.i+=d;S.c=0;draw()}
function end(){if(S.c)fin();else{S.c=1;draw()}}
function fin(){clearInterval(T);S.d=1;draw();scrollTo(0,0)}
function res(){let D=0,Y=0,B=0,w="";Q.forEach((q,i)=>{const a=S.a[i];if(a<0)B++;else if(a==q[5])D++;else Y++;if(a!=q[5])w+=`<div class="w"><b>${i+1}.</b> ${q[0]}<br><span class="m">Senin cevabın: ${a<0?"boş":L[a]+") "+q[a+1]}</span><br>Doğru: <b>${L[q[5]]}) ${q[q[5]+1]}</b></div>`});
const n=D-Y/4;$("#app").innerHTML=`<h1>Sonuç</h1><div class="card"><div class="big">${n.toFixed(2)} net</div><p>${D} doğru · ${Y} yanlış · ${B} boş<br>Başarı: %${Math.round(D/Q.length*100)}</p></div>${w?"<h2>Gözden geçir</h2>"+w:"<p>Hepsi doğru.</p>"}<button class="p" onclick="S=null;draw()">Yeniden başla</button>`}
draw();
</script></body></html>
