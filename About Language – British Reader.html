<script>
const READINGS={Introduction:[
["p","The assumption underlying this book is that teachers of English not only need to be able to speak and understand the language they are teaching; they also need to know a good deal about the way the language works: its components, its regularities, and the way it is used. It is further assumed that this kind of knowledge can usefully be gained through the investigation – or analysis – of samples of the language itself. Accordingly, the core of the book consists of sequences of tasks, the purpose of which is to raise the user’s understanding of how language works, that is, to promote language awareness."],
["h","What is language awareness?"],
["p","Acquiring your mother tongue is an unconscious process, like learning to walk, and leaves no trace in memory. Likewise, using the language thus acquired involves little or no conscious attention to its formal properties. ‘Language is like the air we breathe. We cannot do without it, but we do not often consciously pay attention to it’ (Van Lier 1995). It is not surprising, then, that we have a hard time trying to describe what it is that we intuitively ‘know’ about the language that we speak. Even such basic concepts as noun, verb and preposition, let alone phoneme or clause, are not self-evident. It usually requires someone with the relevant expertise to point these elements out to us – to make them explicit. This is what language awareness is: explicit knowledge about language."],
["p","This should not be confused with the ability to speak and write the language, i.e. language proficiency. The one does not assume the other: as was pointed out, language proficiency – especially for native speakers – is largely implicit and intuitive, whereas language awareness, by definition, is conscious and can be articulated. Put another way: one is acquired, while the other is learned – although, as Andrews (2007) points out, in language classes where the target language is also the medium of instruction, it is often difficult to disentangle the two: ‘Once teachers are in the classroom, anything they say about grammar during the lesson not only will draw on their subject-matter knowledge, but will also be mediated through their language proficiency’. In an ideal world, the language teacher will be both language proficient and language aware."],
["p","In first language education the focus of language awareness is broad, encompassing not only the linguistic domain, for example, the grammar of the language, but the sociolinguistic and cultural domains as well. In the words of The National Council for Language in Education Working Party on Language Awareness: ‘Language Awareness is a person’s sensitivity to and conscious awareness of the nature of language and its role in human life.’ (Donmal 1985, emphasis added). Typical activities for children might involve the exploration of the differences between written and spoken language, for example, or the researching of dialect diversity and its effects. Such activities may extend beyond the development of literacy and have a broader educational remit. In second language education language awareness has a narrower compass, referring – traditionally, at least – to linguistic knowledge only, and to the teacher’s knowledge rather than the learner’s."],
["p","Put simply, it is the knowledge that teachers have of the underlying systems of the language that enables them to teach effectively."],
["p","This is not to suggest that the broader picture – the role of language in human life – has no relevance to second language education. On the contrary, the learning of another language is significantly influenced by cultural and attitudinal factors and this is increasingly reflected in the Content and approach of current English language teaching (ELT) materials. Nevertheless, it is not within the scope of this book to explore these factors. So, if this book is ‘about’ language, it is about language in the narrower sense, that is the analysis of the linguistic systems that constitute language."],
["h","What is language analysis?"],
["p","If language awareness is the goal, then language analysis is the route to it – or one route, at least. A more direct route might simply be to get hold of an up-to-date grammar and read it from cover to cover. It is a basic tenet of this book, however, that working out something for yourself pays greater dividends in terms of memory and understanding than simply having it explained to you. In other words, an inductive – rather than a deductive – approach to learning underpins the design of the tasks that follow. This is also consistent with the view that a discovery approach to grammar is an effective pedagogical option in second language classrooms. Language analysis, then, is a form of guided research into language. The aim of this research is to discover the language’s underlying systems, in order to be in a better position to deal with them from a pedagogical perspective. Hence, the tasks do not stop at the point where the rules are laid bare – they are designed to invite the teacher to consider the pedagogical implications and classroom applications of these rules and systems by, for example, studying and evaluating relevant teaching materials."],
["p","It is perhaps important at this point to emphasise what language analysis is not. As suggested above, it is not what is often called ‘language arts’, that is, the study of one’s first language in order to appreciate its expressive and stylistic qualities, and in order to be able to speak and write like an educated user of the language. This is not to deny that language has an expressive function, as realised in literary texts, but for most learners of English as a second language this may not be a priority. Nor is language analysis the formal study of language known as ‘linguistics’. The object of study is not language as an end in itself. The goal of language analysis for teachers of English is strictly a pedagogical one, i.e. what is it that a teacher needs to know about English in order to teach it effectively as a second language? While it is the case that all sound pedagogical descriptions of English will ultimately derive from linguistic models, or at least be accountable in terms of linguistic theory, they do not depend on these models and theories for their validity. Their validity is determined by their relevance to classroom practice – and, ultimately, by learner outcomes. After all, languages were being taught successfully and pedagogical rules were being formulated long before the advent of linguistics as a science."],
["h","Why language awareness and language analysis?"],
["p","It would seem to be axiomatic that knowledge of subject matter is a prerequisite for effective teaching, whether the subject be mathematics, history, geography, or, as in this case, a second or foreign language. This is certainly the perception of learners: in a survey of several thousand former foreign language students who were asked to identify the qualities of ‘outstanding’ language teachers they had been taught by, the quality that was most frequently cited was that the teacher had had ‘thorough knowledge of subject matter’ (Moscowitz 1976). This was a characteristic quoted more often than, for example, the fact that the teacher was ‘fluent in the use of the foreign language’ or was ‘enthusiastic, animated’."],
["p","This view is echoed throughout the literature on language awareness. For example, Andrews (2007) is emphatic: ‘The language-aware L2 teacher is more likely to be effective in promoting student learning than the teacher who was not language-aware’. It is an assumption that is manifested in the design of teacher training programmes, both at pre-service and in-service level, and at undergraduate and graduate level: there are few courses that do not have a prominent language awareness component, even if it is named linguistics or language analysis or simply grammar."],
["p","And yet there is a school of thought that argues that language awareness – or, at least, familiarity with the grammar – is incidental to effective teaching, and may even be prejudicial to it, especially when it becomes, not simply the means, but the object of learning a language. This view dates back at least to the late nineteenth-century Reform Movement and its reaction to grammar-translation methods. The ‘direct method’ approaches that ensued, and that in turn helped shape audiolingualism, rejected both translation and explicit reference to grammatical rules. These proscriptions persisted into the early days of communicative language teaching (CLT) and were fuelled in part by the work of Krashen (1982) who argued that language acquisition, both first and second, occurs independently of explicit knowledge of rules. Proponents of task-based instruction, e.g. Prabhu (1987), similarly argued that grammatical competence develops when the learner’s attention is focused exclusively on communicating meanings. The popularity of this position may have been partly reinforced by an attendant boom in demand for ‘native-speaker’ teachers, whose knowledge of formal grammar was often minimal and whose training was typically brief."],
["p","Nevertheless, there is an intuitive appeal in the idea that language acquisition simply ‘grows’, like a plant, given the right conditions of nurture. And the frustration felt by generations of learners who, although steeped in the grammar of a language were incapable of speaking it, has fortified the case for more ‘natural’ and less academic approaches to second language learning. But whether you subscribe to this position or not, the argument that it exempts teachers from the need to ‘know grammar’ confuses the needs of teachers on the one hand, and of learners on the other. Language teachers, regardless of the methodology they adopt, are still language teachers. Whether or not they choose to make explicit to the learners the systems underlying the language they are teaching, they are still bound to be authorities in the language itself."],
["p","This is because, at every stage of the process, the decisions that govern language teaching are frequently linguistic ones. At the planning level, language awareness aids in the anticipation of learners’ learning problems so that lessons and materials can be pitched at an appropriate level. It also helps in interpreting coursebook syllabuses and in gearing teaching objectives to the demands of formal assessments. At the level of execution, language awareness is needed in order to deal satisfactorily with errors, to field learners’ queries and to help in the interpretation and production of written texts. And, importantly, a perceptible lack of such awareness, as evidenced by an inability to present or explain new language clearly and efficiently, can have a negative effect on learners’ motivation."],
["p","Of course, there have always been teachers who have been over-zealous in their desire to display their language awareness, and teachers who have been over-concerned with linguistic accuracy at the expense of fluency – teachers, in short, who have given grammar teaching a bad name. As Wright (1991) has pointed out: ‘One great danger of acquiring specialist knowledge is the possible desire to show learners that you have this knowledge’. But this is not a problem of too much knowledge; it is a problem of not enough methodology. The remedy for ‘chalk-and-talk’ type teaching lies in (re-)training such teachers in the use of techniques that are more consistent with what we now know about the way people learn and what language proficiency consists of. Moreover, the non-interventionist approach advocated by Krashen, Prabhu and their followers has long since been superseded by a renewed interest in the benefits of form-focused instruction, i.e. teaching that directs attention to the formal properties of language, including the explicit teaching of grammar and error correction. A failure to attend to the formal features of the language, it has been argued, explains why many learners in ‘acquisition-rich’ contexts still do not achieve anything like a native-like mastery of the second language – many, indeed, falling far short. Hence, the case for explicit, pro-active teaching of grammar has been argued on the grounds that it can counteract the premature stabilization of the learner’s developing grammatical system that has been shown to result from an exclusive focus on meaning. A ‘focus on form’ is particularly important as a counterbalance to more meaning-based teaching approaches, such as in classrooms where the focus is primarily on content, as in immersion or ‘content and language integrated learning’ (CLIL) contexts. Moreover, a case has been made for grammar teaching acting as a kind of ‘advance organizer’, that is, it primes learners to notice the targeted grammar item when it occurs in their linguistic environment. Finally, there are those who argue that explicit knowledge can become automated through practice, thereby validating the traditional present – practise – produce (PPP) teaching paradigm."],
["p","It would seem, therefore, that – in an educational climate that favours at least some explicit focus on language features – there is no escaping the fact that teachers need to be sufficiently knowledgeable about, at the very least, those features of language that will be the object of focus. In the end, though, and whether or not we make explicit reference to rules and terminology in our teaching, language is what we deal with, and language is inherently interesting. In fact, language teaching brings together two of the qualities that most uniquely define us as humans: language and cultural transmission, i.e. teaching. If we cease to be fascinated by either, we risk turning our vocation into just another routine occupation."],
["h","What do teachers need to know about language?"],
["p","Having addressed the question as to why language awareness is important, it is time to look at what this awareness consists of. For teaching purposes, knowledge about language is traditionally construed as knowledge about grammar. The ‘language analysis’ strand of most pre-service and in-service courses tends to deal primarily with grammar, with a strand on phonology often included. And, on closer scrutiny, the grammar syllabus is almost exclusively concerned with features of verb morphology (the so-called tenses) with little reference to syntax, let alone phraseology. This somewhat narrow perspective on language is, of course, consistent with the notion that pedagogical grammar – the grammar for teaching – is a sub-set of descriptive grammar, the comprehensive description of the language as it is currently used. But even a descriptive grammar represents only a portion of what occurs in actual language use – just as a map of the night sky is only the visible fragment of a vastly more extensive system. Moreover, language is changing, morphing, shifting, fragmenting and merging even as we speak. No single ‘grammar’ is capable of capturing this dynamism and complexity."],
["p","We could represent these different grammars in the form of embedded circles:"],
["p","1. all grammar"],
["p","2. descriptive grammar"],
["p","3. pedagogical grammar"],
["p","4. coursebook grammar"],
["p","Notice that ‘coursebook grammar’ is subsumed under pedagogical grammar, due to the somewhat narrow focus that general English coursebooks adopt. Compare, for example, the grammar syllabus of a typical intermediate coursebook with the index of a pedagogical grammar, such as Martin Parrott’s Grammar for English Teachers (2010): many items in the latter do not receive a great deal attention in the former. Arguably, then, teachers whose knowledge is coextensive only with coursebook grammar (i.e. the smallest circle) may not be equipped for the task of dealing with all the kinds of language issues that arise in the course of teaching."],
["p","How much knowledge about language is necessary, then? A lot will depend on the teaching context and the specific needs of the learners. If, for example, you are teaching very young learners, the use of metalanguage – i.e. the language about language – is unlikely to make a lot of sense, and therefore there is less pressure on the teacher to display such knowledge. Teaching beginners, too, is probably more a matter of facilitating the acquisition of a critical mass of vocabulary and formulaic language than of transmitting ‘facts’ about the language. At the other end of the spectrum, however, such as the teaching of advanced adults, or those preparing for formal examinations, or those needing to read or write academic texts, an extensive knowledge of grammar, lexis, phraseology, phonology and discourse will be a requirement."],
["h","Who is this book for?"],
["p","Once the need for language awareness is accepted, the question remains: how do you get it? The particular problem for many language teachers is that, unlike, say, teachers of mathematics or history, they may never have formally studied the subject that they are teaching. This is, of course, typically the case of teachers who are teaching their first language (their L1). It is a common experience of novice native-speaker teachers of English to discover that their explicit knowledge of English grammar is fragmentary at best, and, at worst, may well be below the level of their students."],
["p","Teachers for whom English is a second language (L2) are often at an advantage here, since they have usually experienced English learning first-hand. But, even for these teachers, ‘some reconversion and updating of awareness (e.g. from structural to functional, from prescriptive to descriptive) may be called for’ (Britten 1985)."],
["p","Who, then, is this book for? Essentially, for any teachers, or teachers-to-be, whether native speakers of English or not, either teaching in the public or the private sector, who need to fine-tune their language analysis skills. For example: trainee teachers on courses in preparation for an initial teaching qualification, or for teachers taking in-service training courses at either undergraduate or graduate level. Educational administrators responsible for providing in-service programmes for their teaching staff may find the tasks useful; so, too, may informal teacher development groups. Finally, it is hoped that the book will be of use to teachers studying on their own."],
["h","How is it organised?"],
["p","There is an Introductory unit, whose main purpose is diagnostic, followed by 30 units, with about ten tasks per unit. The unit topics have been chosen to reflect the syllabus specifications of typical pre- and in-service training courses. These specifications, in turn, tend to match the content areas of current published EFL/TESOL materials, both textbooks and pedagogical grammars. Despite the criticisms that have been levelled at the discrete-item, verb-phrase weighted nature of these kinds of syllabuses, it is nevertheless the case that most teachers will be working within this paradigm, and will need to familiarise themselves with the categories and terms they are likely to meet."],
["p","The sequence of topics adopts a ‘bottom-up’ approach to language: that is, the smallest unit of description, the phoneme, is the starting point, and the levels of analysis proceed through words (and morphemes), phrases and sentences and, finally, whole texts. It would be just as logical (if not more so) to start at the topmost level of analysis – the text – and work ‘down’. For this reason, the units have been designed to be as independent as possible, so that the sequence can be adapted to the specific needs of the training programme."],
["p","Each unit typically consists of a variety of activity types, including: identification tasks; matching and categorization tasks; explanation and interpretation tasks; and evaluation and application tasks."],
["p","A key principle that has guided the preparation of these materials is that, as much as possible, the examples chosen to illustrate features of the language systems have been collected from authentic sources. This is consistent with a growing commitment on the part of grammarians and lexicographers to describe real usage, and to avoid at all costs a dependence on the kind of contrived examples often found in traditional grammars. (The costs, of course, include brevity and comprehensibility: authentic examples are, by definition, unsimplified.) Likewise, it is felt that language divorced from its co-text (not to mention its context of use) has little value for the purposes of analysis. Many teacher trainers will be familiar with the kind of fruitless arguments that often result from the attempted analysis of sentences in isolation. Nevertheless, it is simply not practicable to provide the complete co-text for a citation, and many of the examples will have to be taken on trust. Moreover, most teachers have to work with materials that not only use decontextualised, manufactured examples of language for presentation and practice purposes, but often ‘present’ language rules that are contradicted by the evidence. Since this is essentially a practical introduction to language analysis, exposure to such materials is of key importance in terms of preparing teachers for some of the conundrums they will encounter in the classroom. That some of these conundrums are created by the materials themselves is a point worth making, even at the risk of occasionally presenting the trainee with conflicting views on certain issues."],
["p","At the same time, it is in the nature of language – essentially a complex, unitary and unstable entity – to resist attempts at dissection and compartmentalisation. There are few easy answers in language analysis: even such fundamental categories as noun, verb, adjective and adverb are notoriously fuzzy. The trainer and the trainee should not be surprised, therefore, if there are often more questions raised than can be neatly and conveniently answered."],
["p","Nor is the material exhaustive. There is a great deal that has had to be left out, in the interests of clarity, of space and of perceived usefulness. Readers should not expect that here they will find the last, or even the latest, word on every issue dealt with. But, if any frustration or disagreement that results from using these materials encourages teachers to research the areas in question more exhaustively, so much the better."],
["h","Key and commentaries"],
["p","Suggested answers to individual exercises and the commentaries that accompany them make up the latter part of the book, and should be used in conjunction with the tasks in the units. The commentaries are more than simply answers: they attempt to provide explanations for the answers, and are designed to be used by both the individual reader and by tutors using these on courses. An attempt has been made to anticipate sources of confusion, but, again, the commentaries are not exhaustive, and those readers interested in pursuing particular areas should consult the References."],
["h","What is new about this edition?"],
["p","Since this book was first published there have been a number of important developments both in the way that the English language has spread and diversified, and in the way that grammatical and lexical description has been enhanced using digital tools. These developments have informed the preparation of this second edition."],
["p","The global spread of English and its consequent diversification were already facts of life in the mid-1990s, but these trends have accelerated, driven in part by the mutually reinforcing forces of globalization and the internet, and also by the fact that English is not just a second or foreign language for many learners, but has been appropriated by its users to become an international language, or global lingua franca. The consequent impact of this development on the norms of correctness and appropriacy, formerly measured exclusively by the standards of its native speakers, has challenged the authority of ‘traditional’ grammars, as well as forcing a re-evaluation of the goals of English language instruction in general. English, which – like all languages – has always been a ‘moving target’, in a continual state of flux, is even more slippery and elusive than it was two decades ago. In acknowledging this dynamism and diversity, a chapter on the varieties of English has been included. Moreover, an attempt has been made to redress the somewhat British English focus of the first edition, by, at the very least, including more content that represents American English, particularly in the chapters on phonology. At the same time, the concept of English as a Lingua Franca (ELF) has necessitated recognition of the fact that learners’ goals in, for example, pronunciation, may no longer be native-like ones, and that, by extension, the whole notion of ‘correctness’ has been problematised."],
["p","One way that linguists keep track of all this language variability, as well as of those elements that remain stable, is through the use of language corpora (sing. corpus), that is, digitally stored databases of attested language in use. This edition of About Language has been able to draw on various sub-corpora that are curated by Cambridge University Press. These include a corpus of learner language, which has been invaluable as a source of examples of learners’ ‘errors’."],
["p","Advantage has been taken of the release of a new edition, too, to update the texts and pedagogical materials that contextualize language items or that exemplify ways of teaching them, and to include texts from a wide range of discourse types, both spoken and written, print and digital. As in the first edition, wherever possible only authentic texts have been used on the grounds that these are more representative, more reliable and often more interesting than contrived texts and citations."],
["h","How do you use this book?"],
["p","It is not expected that all the material will be of equal relevance to different groups of users: teacher trainers are advised to use the material selectively, choosing those units, and those tasks within the units, whose content is both relevant to the courses they run and practicable within the constraints in which they are operating."],
["p","The material is designed for – and has been trialled extensively with – classes of trainee teachers working in pairs or groups, but it can also be used by trainees working individually."],
["p","A recommended basic approach for teacher trainers using the material is the following:"],
["p","Establish the topic, for example, by reference to the trainees’ own classes – if the programme includes a practicum; or to a sample of typical learner errors relating to the language area in question; or to the teaching materials the trainees have used, and particular problems that they have met with regard to the topic. Alternatively, as a ‘warmer’, get the trainees to do a short activity designed for EFL students and targeted at the language area under study. Grammar Practice Activities by Penny Ur and Five-Minute Activities by Penny Ur and Andrew Wright are good sources for such activities."],
["p","Trainees work on the tasks, either individually, in pairs or in groups. The tasks within each unit are designed to be used in sequence, but it is recommended that each task be checked before moving on to the next. Some tasks can be set for homework, to be done in advance of the next session, which could be used to clarify areas of difficulty and to design practical classroom applications."],
["p","To check the tasks, the trainees can either be referred to the Key and commentaries at the back of the book, or the trainer can solicit feedback on the tasks from pairs/groups and lead a general discussion of the issues raised. Even if the task rubric does not specify it, it is important, where possible, to try to relate each task to the specific teaching context of the trainees."],
["p","Possible follow-up activities might include:"],
["p","– collecting and analysing examples of learner language relating to the area under study;"],
["p","– collecting and analysing authentic (naturally occurring) examples of the area under study;"],
["p","– evaluating available ELT materials with regard to their treatment of the language area;"],
["p","– planning a lesson or a sequence of lessons to deal with the language area in question, targeted at a specific class of learners and, if possible, teaching the lesson(s), evaluating the effectiveness of the lesson in dealing with anticipated problems with regard to the language point; and"],
["p","– if the trainees are to sit an examination, writing an essay related to the theme, to be done either in their own time or under examination conditions."]
],
"Introductory unit":[
["h","Introduction"],
["p","This unit is designed to get you started, and invites you to consider some key issues related to the teaching of language - language being the operative word here - since the focus of this book is less on methodology than on the nature of language itself. Nevertheless, since it is written for language teachers, questions of methodology will inevitably enter into the discussion."],
["h","Tasks"],
["h","1 Opinions about language learning and teaching"],
["p","Consider these statements. To what extent and in what respects do you agree/disagree?"],
["p","a Learning a language is first and foremost a question of learning its grammar."],
["p","b It is the language teacher’s responsibility to know as much as possible about the language itself."],
["p","c Grammar is best learned deductively - that is, by studying rules and then applying the rules to examples."],
["p","d Grammatical terminology is best avoided in the classroom."],
["p","e Giving learners complete rules, even if these are more complicated, is better than giving them half-rules."],
["p","f Language should always be studied in its typical contexts of use, rather than in isolation."],
["p","g English doesn’t have very much grammar, compared to some languages."],
["p","h The most important part of grammar is the verb system."],
["p","i There is a standard grammar of English that is shared by all its varieties."],
["h","2 Read this text and answer the questions:"],
["p","INDEPENDENT News Voices Culture Lifestyle Tech"],
["h","London shopkeeper fends off masked gunman using Ribena bottle"],
["p","The shopkeeper managed to slam the gunman’s fingers in the till before throwing a Ribena bottle at him."],
["p","Ryan Ramgobin 6 hours ago 0 comments"],
["p","A London shopkeeper fended off a masked gunman by slamming his fingers in the till and throwing a Ribena bottle at him."],
["p","The shopkeeper Mayooran Masilamani, 32, dived over the counter and chased Ahmid Dorda, 24, out of the West Kensington branch of Londis."],
["p","It was the second time the branch run by Mr Masilamani has been targeted by Dorda. On Boxing Day last year, he was chased away by one of the customers."],
["p","Dorda was arrested by police on May 11 where officers found a black handgun on his person. Detectives searched his home in Kensington and used video footage and forensic evidence to link him to 13 armed raids on small supermarkets across central London."],
["p","Dorda is today starting a seven-and-a-half year prison sentence after admitting to nine counts of armed robbery and three attempted robberies."],
["p","Mr Masilamani told the Evening Standard: “I think he should’ve got longer in jail because he scared so many people.”"],
["h","Text type"],
["p","a What kind of text is this? What features of the layout tell you this?"],
["p","b What is the overall purpose (or function) of the text – is it, for example, to advertise, to inform, to complain, to criticise?"],
["p","c Identify any stylistic features that are typical of this kind of text, for example, the use of the present tense in the title."],
["h","Text organisation"],
["p","Put these facts in chronological order:"],
["p","a The shopkeeper slammed the gunman’s fingers in the till and threw a bottle at him."],
["p","b The shopkeeper chased the gunman out of the shop."],
["p","c The gunman was chased out of the shop by a customer."],
["p","d The gunman was arrested."],
["p","e Police searched the gunman’s home."],
["p","f The gunman is starting a prison sentence."],
["p","Why has the above order been chosen for the text, rather than the chronological one?"],
["h","Cohesion"],
["p","a What do the following words refer to? It (line 10); he (line 11); his (line 14); him (line 15); he (line 20). How do you know?"],
["p","b A London shopkeeper → The shopkeeper Mayooran Masilamani: Why the change from a to the?"],
["p","c How many words can you find that have something to do with (1) shops; (2) physical action; (3) crime and punishment?"],
["p","d Identify these references: last (line 11); today (line 17)."],
["p","e Why do the features in (a–d) help make the text cohesive?"],
["p","Now that you have looked at the text as a whole, work through the following questions, which focus on specific parts of it."],
["h","Vocabulary"],

["p","For the purposes of teaching, a full account of a linguistic form, as found in a descriptive grammar, may be unhelpful. Learners need rules that are easy to understand and to apply. These are called pedagogical rules. They tend to be based on descriptive rules, but are adapted to the needs of the learner."],
["p","Here is a rule from a descriptive grammar, and the ‘same’ rule from the reference grammar section of an EFL coursebook. What are the significant differences?"],

["p","The indefinite article is used with singular countable nouns. It narrows down the reference of the following noun to a single member of a class and is often used to introduce a new specific entity in discourse. Subsequent references generally take the form of definite noun phrases or personal pronouns, as shown in the following example:"],
["p","1 A cat₁ was the victim of a cruel attack when she₁ was shot in the neck by a pellet₂. The tortoiseshell cat₁ was found wounded and frightened in Grangetown, Middlesbrough, and brought to an animal sanctuary. The pellet₂ went right through the cat₁’s neck and came out the other side, leaving a gaping wound. (NEWS) <subscripts indicate co-referential noun phrases>"],
["p","The indefinite article can also be used in contexts where the noun phrase does not refer to any specific individual. Compare:"],
["p","2 I’m looking for a millionaire, she says, but I don’t see many around — (CONV)"],
["p","3 “I feel terrible. I need a friend.” (FICT)"],
["p","4 Police are looking for a scruffy man aged 17 to 21. (NEWS)"],
["p","In 2 and 3 the reference is to a non-specific new entity, while 4 refers to a particular newly introduced entity (cf. the use of certain; 4.4.6D)."],
["p","The indefinite article can also serve, as in 5, to classify an entity (3.5.3.1), or it can be used generically 6 to express what is typical of any member of a class (see also 4.4.1.4)."],
["p","5 My husband is a doctor. (FICT)"],
["p","6 A doctor is not better than his patient. (FICT†)"],
["p","(from Longman Grammar of Spoken & Written English by Biber et al., 1999)"],

"2 Varieties of English":[
["h","Introduction"],
["p","So far we have been talking about standard English as if it were a single language with universally agreed conventions. However, given the enormous number of speakers of English in the world, it is inevitable that there are many varieties of English, such that some writers talk about World Englishes, rather than World English. This unit looks at some of the many varieties of English, including those used by speakers whose first language is not English."],
["h","Tasks"],
["h","1 Language change"],
["p","Language varieties emerge as languages change, and language change is inevitable. As one scholar puts it, ‘Language is of its nature unstable. It is essentially protean in nature, adapting its shape to suit changing circumstances’ (Jenkins 2003). As it spreads globally, English, more than many languages, has had to adapt to very different circumstances. But even within its birthplace, Britain, it has evolved to such an extent that it is now difficult to read a text such as Chaucer’s Canterbury Tales, written just over 600 years ago, without a ‘translation’."],
["p","To illustrate these changes, here are some short quotes about English, taken from texts written from 1350 to the present day. Can you order them from oldest to most recent? What clues help you to do this?"],
["p","a The English language as it is spoken by the politest part of the nation, and as it stands in the writings of our most approved authors, oftentimes offends against every part of grammar."],
["p","b I am of this opinion that our tung shold be written cleane and pure, vnmixt and vnmangeled with borrowing of other tunges."],
["p","c Not only the several Towns and Countries of England, have a different way of Pronouncing, but even here in London, they clip their words after one Manner about the Court, another in the City, and a third in the Suburbs."],
["p","d Bobe lered and lewed, olde and ȝonge, Alle vnderstonden English tonge."],
["p","e We are walking lexicons. In a single sentence of idle chatter we preserve Latin, Anglo-Saxon, Norse; we carry a museum inside our heads, each day we commemorate peoples of whom we have never heard."],
["p","f Our tong is (and I doubt not but hath beene) as copious, pithie, and significative, as any other tongue in Europe."],

["h","3 Spoken versus written"],
["p","One way in which language varies is in terms of the medium: whether, for example, it occurs as spontaneous speech, or whether it is written down or - more likely nowadays - keyed in. The distinction is not quite as simple as that, since a lot of written language either includes speech that is reported (as in fiction), or is written in order to be spoken aloud (as in drama). Moreover, the widespread production of text using digital means, such as emails, text messages and social media, has blurred the distinction between spoken and written language even further. Nevertheless, see if you can identify the original medium of the following short texts, choosing between:"],

["h","5 Occupational language and jargon"],
["p","In order to communicate with one another, members of an occupational or academic community share a specialized vocabulary. Learning this language variety is part of the process of becoming integrated and accepted as a legitimate member of the community. To outsiders, or newly recruited members, this vocabulary is often disparagingly called ‘jargon’, because it seems to exclude those who are not ‘in the know’."],
["p","The field of applied linguistics (including language description, and language learning and teaching) has its own jargon, too. For example, can you identify the specialized vocabulary in the following text? Which items are specific to this field, and which are words that have been borrowed from non-technical English and given a more technical meaning?"],
["p","As we have already noted, vocabulary (or lexicon) is the most important level of L2 knowledge for all learners to develop – whether they are aiming primarily for academic or interpersonal competence, or for a broader scope of communicative competence that spans the two ... Many technical terms must be learned for any specialised field, such as lexicon, morphology, phonology, and discourse for linguistics ... Besides individual vocabulary items (single words and compounds), other lexical elements which vary in frequency by domain include idioms, metaphors, and other multiple word combinations that commonly occur together (collocations). These “chunks” of language are typically memorised as holistic units ... The most frequent multiple-word combinations in English interpersonal speech include greetings and other formulaic routines, and such discourse fillers, hedges, or smoothers as you know, kind of, and never mind."],
["p","(Saville-Troike 2006)"],
["h","6 Regional varieties"],
["p","As a language spreads from one geographical region to another, it changes. Differences in pronunciation from one region to another are what we recognize as different regional accents. But changes also occur at the level of vocabulary and grammar. Writers of fiction often attempt to capture these differences. Here, for example, are three extracts by writers who are attempting to portray different regional varieties of English. Can you identify the region in each case? Choose between:"],
["p","Brooklyn, New York"],
["p","Scotland"],
["p","New Zealand"],
["p","What distinguishing features of the pronunciation, vocabulary and grammar of each variety are exemplified in the extracts?"],
["h","Extract A"],
["p","Thing is, as ye git aulder, this character-deficiency gig becomes mair sapping. Thir wis a time ah used tae say tae aw the teachers, bosses, dole punters, poll-tax guys, magistrates, when they telt me ah was deficient: ‘Hi, cool it, gadge, ah’m jist me, jist intae a different sort ay gig fae youse but, ken?’ Now though, ah’ve goat tae concede thit mibee they cats had it sussed. Ye take a healthier slapping the aulder ye git. The blows hit hame mair. It’s like yon Mike Tyson boy at the boxing, ken?"],
["h","Extract B"],
["p","So like I say, I’m waitin’ for my train t’come when I sees dis big guy standin’ deh – dis is duh foist I evh see of him. Well, he’s lookin’ wild, y’know, an’ I can see dat he’s had plenty, but still he’s holdin’ it; he talks good an’ is walkin’ straight enough. So den, dis big guy steps up to a little guy dat’s standin’ deh, an’ says, “How d’yuh get t’ Eighteent’ Avenoo an’ Sixty-sevent’ Street?” he says."],
["p","“Jesus! Yuh got me, chief,” duh little guy says to him. “I ain’t been heah long myself. Where is duh place?” he says. “Out in duh Flatbush section somewhere?”"],
["p","“Nah,” duh big guy says. “it’s out in Bensonhoist. But I was neveh deh befoeh. How d’yuh get deh?”"],
["h","Extract C"],
["p","Shucks you guys have done this place up nice, eh? Last guys that were in here were incredible, eh, nah, it was just appalling, you guys look real nice, you know, I hope you don’t mind me saying, eh, but now this place looks primo as. Yeah, ’cause I work like 60 hours a week you know, I need my sleep, eh, so it’s choice there’s some quiet people next door, I was hoping that you guys would be nice. How many of yous are there in here? Just you and your hubby, eh? Where is he then? Oh yeah. He works in TV, eh? Yeah I wouldn’t mind working in TV, makes heaps of money. Yous are American, eh? Yeah I was helping them fix his car the other day, battery terminals were loose. Shucks you guys must be fairly well-off, then, far out, we have a hard enough time paying the rent next door, and there’s four of us in there... Yeah, all guys, it’s pretty sucks, man, sometimes, all guys. Yeah, I wouldn’t mind moving out, eh, someplace with a bit of order, eh. Shucks, so you guys got a spare room, then eh? That’s awesome, eh, choice for when all the rellies come up."],
["h","7 British and American English"],
["p","The most well-known division between regional varieties of English is that between standard British English, on the one hand, and standard American English, on the other. Apart from differences in pronunciation, the main way that these two varieties are distinguished is in terms of their vocabulary. Here are two activities on this. Can you do them?"],
["p","Replace the underlined British English words with American English words:"],
["p","So, I was driving on the [1] ‹motorway› and I pulled off and stopped at a [2] ‹shop› to buy some [3] ‹sweets› and some [4] ‹biscuits›, and I’m standing on the [5] ‹pavement›, when this huge [6] ‹lorry› pulls up and this young [7] ‹lad› gets out. ‘Is there a [8] ‹toilet› round here?’, he asks. ‘You’re a bit young to be driving that, aren’t you?’, I say. He says, ‘It’s OK, my [9] ‹mum›’s driving. We’re on [10] ‹holiday›. We’re off to see the [11] ‹football›. Oh, and do you know anywhere I can get some fish and [12] ‹chips›?’ he asks."],
["p","Can you avoid some of the most common confusions arising between British and American speakers? Try the following quiz."],

["h","8 English as a lingua franca"],
["p","As English is used more and more as a means of communication between speakers who do not share the same first language, a case has been made for the emergence of a new variety of English: English as a Lingua Franca (ELF) or English as an International Language (EIL). While there is disagreement as to the uniformity or the stability of this variety, some of its grammatical features might include:"],
["p","absence of third person simple –s in the present tense: he make us laugh a lot; the woman go to buy a new dress"],
["p","regularization of past tense forms: he feeled happy to see her; she speaked slowly"],
["p","non-standard use of articles a and the, and the zero article: even the taxi driver is doctor or engineer or teacher; they can find the happiness; our countries have signed agreement"],
["p","plural forms for uncountable nouns and absence of plural where numbers are explicit: new accommodations; two more condition"],
["p","use of progressive form with stative verbs: I am believing it; they are belonging to me; I am not knowing any one"],
["p","conflation of past simple and present perfect: I have seen him yesterday; the nicest scenery I ever saw in my entire life"],
["p","absence of subject verb agreement: if you think that the ideas is good …; not every person are good at science"],
["p","interchangeable use of who and which as relative pronouns: one thing who is strictly forbidden; the first person which I saw …"],

"3 Types of grammar":[
["h","Introduction"],
["p","Language is like the weather: we are so immersed in it that we are not easily able to see how it is patterned. It rains today or it’s sunny tomorrow, but the regularities that underpin these processes are hidden from us. So it is with language. A grammar is an attempt to capture the regularities of language. But because language – like weather – is a synthesis of so many elements, grammars can take different forms, depending on the vantage point. This unit reviews some of the main ways of looking at language."],
["h","Tasks"],
["h","1 Grammar"],
["p","Here are some definitions of grammar. What similarities and differences do you note? Which of these definitions best captures the needs of the second language teacher?"],
["p","a The identification of systematic regularities in language."],
["p","b Grammar studies language as a system of means of expression."],
["p","c What grammar does is this: it treats of the language generally, its sounds, letters and words; it supplies us with a number of rules for the correct way of using the language, and it examines why certain ways of using the language are right, and certain others are wrong, not merely stating rules, but adding reasons."],
["p","d Grammar is the study of the way words, and their component parts, combine to form sentences."],
["p","f Grammar is the process by which language is organized and patterned in order to make meaning."],
["p","g In a narrow sense this refers to the structure of sentences, but in a broad sense it includes everything to do with the structure of language."],
["p","h Grammar is essentially a limited set of devices for expressing certain kinds of necessary meaning that cannot be conveyed by vocabulary alone."],
["p","i A grammar is […] the finite system that characterizes an individual’s linguistic capacity and is represented in the individual’s mind/brain."],
["h","2 Views of grammar"],
["p","Here are some teachers of English offering their opinions on grammar. In each case, what ‘view’ of grammar do their statements seem to express?"],
["p","a Grammar IS very important, because it helps people to use a language much more correctly."],
["p","b Let’s teach the importance of using words to form sentences, rather than grammar itself as some kind of mathematical equation."],
["p","c Grammar, being the core of any language, should be the focus in the teaching of any language."],
["p","d Grammar of English is what food is for the body and petrol for an automobile. It is the basis of English or for that matter any other language without which mastery of the language is incomplete."],
["p","e Grammar is the skeleton of language, so teachers cannot ignore it. No grammar, no language!"],
["p","f My view is that one needs to be primarily interested in the grammar of the language rather than the language of grammar."],
["p","g I think that teaching a student to speak is more important than all the grammar rules in the world because grammar only gives rules but not the active function of the language."],
["h","3 Traditional grammar"],
["p","The grammar that pre-dates linguistics as a discipline and which was commonly taught in schools is now referred to as traditional grammar."],

["h","6 Cognitive grammar"],
["p","Whereas the generative view sees grammar as an abstract system of formal rules, largely independent of meaning and context, a cognitive view emphasizes the way that grammar reflects our experience of the real world – how we see it, move through it and make sense of it. According to this view, thought, perception and language are intimately linked, each affecting the other."],
