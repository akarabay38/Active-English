<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red Umbrella</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#fff;margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
#app{width:100vh;max-width:100vw;aspect-ratio:9/16;height:100vh;background:#f5f5f5;border-radius:0;overflow:hidden;display:flex;flex-direction:column;position:relative;margin:0 auto}
.hdr{background:#ffffff;padding:13px 16px 11px;position:relative;z-index:2;flex-shrink:0;border-bottom:3px solid #e8420a}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.brand-logo{font-size:17px;font-weight:900;letter-spacing:1px}
.brand-logo .active{color:#e8420a}
.brand-logo .english{color:#fff}
.leg-btn{background:#f0f0f0;border:1px solid #ddd;color:#1a3550;border-radius:8px;padding:4px 9px;font-size:9px;font-weight:800;cursor:pointer}
.social-row{display:flex;gap:7px;margin-bottom:9px}
.soc-btn{display:flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;font-size:10px;font-weight:800;border:none;cursor:pointer}
.soc-btn.insta{background:linear-gradient(135deg,#e1306c,#833ab4);color:#fff}
.soc-btn.yt{background:#ff0000;color:#fff}
.soc-btn.tiktok{background:#000;color:#fff;border:1px solid #444}
.soc-btn svg{width:12px;height:12px;fill:#fff;flex-shrink:0}
.story-bar{background:#e8420a;padding:6px 16px;display:flex;align-items:center;justify-content:space-between}
.story-title{font-size:12px;font-weight:900;color:#fff}
.story-label{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.8)}
.leg-panel{margin:6px 14px 0;background:#fff;border-radius:14px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:3;border:1px solid rgba(0,0,0,0.1);flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.illus{flex-shrink:0;height:210px;position:relative;overflow:hidden;margin:0}
.illus svg,.illus>div>svg{width:100%;height:210px;display:block}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;position:relative;z-index:2;min-height:0;background:#fff}
.word-line{text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;min-height:54px}
.wd{display:inline-block;padding:4px 7px;border-radius:8px;font-weight:800;font-size:20px;transition:all 0.15s;border:1px solid transparent;line-height:1.3;color:#1a1a2a}
.wd.punct{font-weight:400;font-size:17px;padding:4px 2px}
.divider{width:44px;height:2px;background:linear-gradient(90deg,transparent,#e8420a,transparent);margin:8px auto;border-radius:2px;flex-shrink:0}
.tr-line{text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;min-height:42px}
.twd{display:inline-block;padding:3px 6px;border-radius:7px;font-weight:700;font-size:15px;border:1px solid transparent;line-height:1.3;color:#333}
.twd.punct{font-weight:400;font-size:13px;padding:3px 2px}
.dots-row{display:flex;justify-content:center;gap:4px;padding:4px 18px 3px;flex-wrap:wrap;flex-shrink:0;background:#fff}
.dot{width:5px;height:5px;border-radius:50%;cursor:pointer;transition:all 0.3s}
.prog-area{padding:0 20px 5px;flex-shrink:0;background:#fff}
.prog-track{width:100%;height:3px;background:rgba(0,0,0,0.08);border-radius:10px;overflow:hidden;margin-bottom:3px}
.prog-fill{height:100%;background:linear-gradient(90deg,#e8420a,#fbbf24);border-radius:10px;transition:width 0.4s}
.prog-lbl{font-size:9px;color:rgba(0,0,0,0.35);text-align:right;font-weight:700;letter-spacing:1px}
.controls{padding:0 20px 26px;display:flex;gap:8px;align-items:center;flex-shrink:0;background:#fff}
.btn-nav{width:46px;height:46px;border-radius:13px;border:1px solid rgba(0,0,0,0.15);background:rgba(0,0,0,0.05);color:#333;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-play{flex:1;height:50px;border-radius:15px;border:none;background:linear-gradient(135deg,#e8420a,#ff6b35);color:#fff;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 4px 20px rgba(232,66,10,0.45)}
.btn-play.paused{background:rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.15);box-shadow:none;color:#333}
.btn-speed{width:46px;height:46px;border-radius:13px;border:1px solid rgba(0,0,0,0.15);background:rgba(0,0,0,0.05);color:#e8420a;font-size:10px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>

   tr:[{w:"Otobüs",r:"subject"},{w:"gelir",r:"verb"},{w:".",r:"punct"}]},
  {en:[{w:"They",r:"subject"},{w:"get",r:"verb"},{w:"on",r:"prep"},{w:"the",r:"article"},{w:"bus",r:"object"},{w:"together",r:"adverb"},{w:".",r:"punct"}],

   tr:[{w:"Artık",r:"adverb"},{w:"Tom'un",r:"subject"},{w:"yeni",r:"adjective"},{w:"bir",r:"article"},{w:"arkadaşı",r:"object"},{w:"var",r:"verb"},{w:".",r:"punct"}]},
];

const SPEEDS=[1,0.75,0.5,1.25],SPLBL=["1x","0.75x","0.5x","1.25x"];
let cur=0,playing=false,activeWord=-1,speedIdx=0,legendOpen=false,britishVoice=null;

function loadVoice(){
  try{
    if(!window.speechSynthesis) return;
    const vs=window.speechSynthesis.getVoices();
    if(!vs||!vs.length) return;
    const female=["Google UK English Female","Microsoft Hazel","Microsoft Susan","Moira","Karen","Tessa"];
    for(const n of female){
      const v=vs.find(x=>x.name===n||x.name.includes(n));
      if(v){britishVoice=v;return;}
    }
    const gb=vs.filter(x=>x.lang==="en-GB"||x.lang==="en_GB");
    if(gb.length){britishVoice=gb[0];return;}
    britishVoice=vs.find(x=>x.lang&&x.lang.startsWith("en"))||null;
  }catch(e){}
}
try{
  if(window.speechSynthesis){
    if(typeof window.speechSynthesis.onvoiceschanged!=="undefined"){
      window.speechSynthesis.onvoiceschanged=loadVoice;
    }
    loadVoice();
    setTimeout(loadVoice,300);
    setTimeout(loadVoice,1000);
  }
}catch(e){}

function makeWd(w,r,isActive,cls){
  const c=C[r]||C.punct;
  const el=document.createElement("span");
  el.className=cls+(r==="punct"?" punct":"");
  el.textContent=w;
  el.style.color=isActive?"#fff":c.text;
  el.style.background=isActive?c.text:c.bg;
  el.style.border="1px solid "+(isActive?c.text:"transparent");
  el.style.transform=isActive?"scale(1.13)":"scale(1)";
  el.style.boxShadow=isActive?"0 0 16px "+c.text+"aa":"none";
  return el;
}

function render(aw){
  activeWord=aw;
  const s=S[cur];
  document.getElementById("sceneContainer").innerHTML=SCENES[cur];
  const svgEl=document.querySelector("#sceneContainer svg");
  if(svgEl){svgEl.style.width="100%";svgEl.style.height="210px";}
  const en=document.getElementById("enLine");
  en.innerHTML="";
  s.en.forEach((item,i)=>en.appendChild(makeWd(item.w,item.r,i===aw,"wd")));
  const tr=document.getElementById("trLine");
  tr.innerHTML="";
  s.tr.forEach(item=>tr.appendChild(makeWd(item.w,item.r,false,"twd")));
  document.getElementById("progFill").style.width=(cur/(S.length-1)*100)+"%";
  document.getElementById("progLbl").textContent=cur+" / "+(S.length-1);
  buildDots();
}

function buildDots(){
  const el=document.getElementById("dotsRow");
  el.innerHTML="";
  S.forEach((_,i)=>{
    const d=document.createElement("div");
    d.className="dot";
    d.style.cssText="width:"+(i===cur?7:5)+"px;height:"+(i===cur?7:5)+"px;background:"+(i===cur?"#e8420a":i<cur?"rgba(232,66,10,0.5)":"rgba(0,0,0,0.12)");
    d.onclick=()=>goTo(i);
    el.appendChild(d);
  });
}

function buildLegend(){
  const el=document.getElementById("legPanel");
  el.innerHTML="";
  Object.entries(C).forEach(([k,v])=>{
    if(!v.lbl)return;
    const d=document.createElement("div");
    d.className="leg-item";
    d.innerHTML="<span class='leg-dot' style='background:"+v.text+"'></span><span style='color:"+v.text+"'>"+v.lbl+"</span>";
    el.appendChild(d);
  });
}

function toggleLegend(){
  legendOpen=!legendOpen;
  document.getElementById("legPanel").style.display=legendOpen?"flex":"none";
  if(legendOpen)buildLegend();
}

function stopSpeech(){if(window.speechSynthesis)window.speechSynthesis.cancel();}

function speakSentence(idx){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  render(-1);
  const text=S[idx].en.map(w=>w.w).join(" ").replace(/["""]/g,"");
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang="en-GB";
  if(!britishVoice) loadVoice();
  if(britishVoice) utt.voice=britishVoice;
  utt.pitch=1.1;
  if(britishVoice) utt.voice=britishVoice;
  utt.rate=SPEEDS[speedIdx];
  let wi=0;
  utt.onboundary=e=>{if(e.name==="word"){render(wi);wi++;}};
  utt.onend=()=>{
    render(-1);
    if(playing){
      const nxt=cur+1;
      if(nxt<S.length){cur=nxt;setTimeout(()=>speakSentence(cur),500);}
      else{playing=false;updateBtn();}
    }
  };
  utt.onerror=()=>{render(-1);playing=false;updateBtn();};
  window.speechSynthesis.speak(utt);
}

function updateBtn(){
  const b=document.getElementById("playBtn");
  if(playing){b.innerHTML="&#9646;&#9646;  PAUSE";b.classList.add("paused");}
  else{b.innerHTML="&#9654;  PLAY";b.classList.remove("paused");}
}

function togglePlay(){
  if(playing){stopSpeech();playing=false;updateBtn();}
  else{playing=true;updateBtn();speakSentence(cur);}
}

function goTo(idx){stopSpeech();playing=false;updateBtn();cur=idx;render(-1);}
function goRel(d){goTo(Math.max(0,Math.min(S.length-1,cur+d)));}
function cycleSpeed(){
  speedIdx=(speedIdx+1)%SPEEDS.length;
  document.getElementById("speedBtn").textContent=SPLBL[speedIdx];
  if(playing){window.speechSynthesis.cancel();setTimeout(()=>speakSentence(cur),80);}
}

render(-1);
</script>
